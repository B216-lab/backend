services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umrs_go_backend}
      POSTGRES_USER: ${POSTGRES_USER:-umrs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-umrs}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-umrs_go_backend}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  osm-admin-import:
    build:
      context: .
      dockerfile: Dockerfile.osm-import
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-umrs}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-umrs_go_backend}?sslmode=disable
      PBF_PATH: /work/data/russia-260510.osm.pbf
      MAPPING_FILE: /work/osm/imposm-admin-mapping.yml
      POST_IMPORT_SQL: /work/scripts/load_osm_admin.sql
      CACHE_DIR: /tmp/imposm-cache
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/work
      - imposm-cache:/tmp/imposm-cache

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: ${SERVER_PORT:-8081}
      DATABASE_URL: ${DATABASE_URL:-postgres://umrs:secret@postgres:5432/umrs_go_backend?sslmode=disable}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "${SERVER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  imposm-cache:
